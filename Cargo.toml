[package]
name = "wikiknit"
version = "0.5.1"
edition = "2024"
rust-version = "1.89"
description = "Lint and knit wikilinks in Markdown vaults (Obsidian and friends): broken links, link rules, unlinked mentions, a note catalog, and agent hooks."
license = "MIT OR Apache-2.0"
repository = "https://github.com/victor-kwak/wikiknit"
homepage = "https://github.com/victor-kwak/wikiknit"
readme = "README.md"
keywords = ["obsidian", "wikilinks", "markdown", "lint", "notes"]
categories = ["command-line-utilities", "text-processing"]
exclude = ["/tests/fixtures", "/plugin", "/.claude-plugin"]

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
pulldown-cmark = { version = "0.13.4", default-features = false }
rayon = "1.12.0"
regex = "1.13.1"
rust-stemmers = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
unicode-segmentation = "1.13.3"

fastembed = { version = "7.1.1", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"], optional = true }

[features]
default = ["semantic"]
# Hybrid search: local embeddings through ONNX Runtime (fastembed). Off: BM25 only, no ONNX.
semantic = ["dep:fastembed"]

[dev-dependencies]
assert_cmd = "2.2.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
